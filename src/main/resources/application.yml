server:
  port: 8080

spring:
  application:
    name: authentication
  datasource:
    url: jdbc:postgresql://localhost:5432/practise_development
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
            format_sql: true
            use_sql_comments: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  output:
    ansi:
      enabled: ALWAYS
jwt:
  secret: 84d7b739ede26cb0330e874d747a02eae9f8e85b952272fe617c4d01bae21264
  access-token-minutes: 15
  issuer: auth-service

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %clr(%m%n){blue}"
