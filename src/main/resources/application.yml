# Main application configuration
# Profile-specific configurations are in separate files:
# - application-dev.yml (development)
# - application-prod.yml (production) 
# - application-test.yml (testing)

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ${APPLICATION_NAME:authentication}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

# Common JWT configuration that applies to all profiles
jwt:
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  issuer: ${JWT_ISSUER:auth-service}

# Global logging configuration that can be overridden by profiles
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
